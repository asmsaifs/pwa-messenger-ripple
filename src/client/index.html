<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Ripple</title>
    <!-- Applies the saved theme before first paint — avoids a flash of the
         wrong theme that a React effect (src/client/lib/theme.tsx) would
         otherwise cause, since that only runs after mount. An external file,
         not an inline <script>, because docs/05 §4's CSP has no
         'unsafe-inline' in script-src. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
