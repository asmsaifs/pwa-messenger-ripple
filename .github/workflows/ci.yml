name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: lint
        run: pnpm lint

      - name: format check
        run: pnpm format:check

      - name: unit + worker tests
        run: pnpm test

      - name: route-policy coverage guard
        run: pnpm guard:policy

      - name: build
        run: pnpm build

  # M6+ adds: DO suites, bundle-size budget guard, e2e (Playwright against
  # wrangler dev), perf (Lighthouse CI), deploy (main only) — see docs/07 §6.
